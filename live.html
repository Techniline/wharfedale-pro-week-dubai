<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0b">
<title>Soundcheck · Live Album</title>
<link rel="icon" type="image/png" href="assets/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"] { --ink: #f5f5f5; --dim: #b5b5b5; --faint: #808080; --grey: #d9d9d9; --cyan: #0dc0df; --teal: #019298; --ease: cubic-bezier(.2,.7,.2,1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050505; color: var(--ink); font-family: 'Manrope', sans-serif; -webkit-font-smoothing: antialiased; }
  html.cursor-off, html.cursor-off * { cursor: none !important; }

  /* fixed 1920 x 960 canvas (2:1 LED wall), scaled by assets/screen.js */
  .screen { position: fixed; left: 0; top: 0; width: 1920px; height: 960px; transform-origin: 0 0; overflow: hidden; background: #0b0b0b url("assets/grille.svg"); background-size: 34px 22px; }
  .screen::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: linear-gradient(90deg, var(--cyan), var(--teal)); z-index: 5; }

  /* ---------- left panel ---------- */
  .panel { position: absolute; left: 0; top: 0; bottom: 0; width: 620px; padding: 66px 0 0 90px; background: linear-gradient(90deg, rgba(0,0,0,0.78), rgba(0,0,0,0.55) 80%, transparent); z-index: 3; }
  .logo { height: 84px; display: block; }
  .wm { margin-top: 26px; font: 900 70px/0.9 'Poppins', sans-serif; color: var(--cyan); text-transform: uppercase; letter-spacing: -1px; margin-left: -4px; }
  .yr { font: 800 46px/1 'Poppins', sans-serif; color: var(--grey); margin-top: 8px; }
  .live { margin-top: 34px; display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 800; letter-spacing: 5px; text-transform: uppercase; color: var(--cyan); }
  .live::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: #ff4d5e; box-shadow: 0 0 16px #ff4d5e; animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }
  .add { margin-top: 40px; display: flex; gap: 24px; align-items: center; }
  .add .qr { flex: none; width: 196px; height: 196px; padding: 12px; border-radius: 20px; background: #fff; box-shadow: 0 0 0 5px rgba(13,192,223,0.4), 0 0 50px rgba(13,192,223,0.3); }
  .add .qr img { width: 100%; height: 100%; display: block; }
  .add b { display: block; font: 800 30px/1.15 'Poppins', sans-serif; }
  .add span { display: block; margin-top: 8px; font-size: 19px; line-height: 1.45; color: var(--dim); font-weight: 700; }
  .host { position: absolute; left: 90px; bottom: 60px; display: flex; align-items: center; gap: 16px; font-size: 15px; font-weight: 800; letter-spacing: 5px; text-transform: uppercase; color: var(--faint); }
  .host img { height: 32px; }

  /* ---------- photo stage: 1300 x 860 at the right ---------- */
  .stage { position: absolute; left: 640px; top: 42px; width: 1220px; height: 860px; }
  .scene { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 40px; opacity: 0; transition: opacity 1.3s var(--ease); }
  .scene.on { opacity: 1; }
  .card { position: relative; height: 860px; border-radius: 20px; overflow: hidden; background: #000; box-shadow: 0 40px 90px -30px rgba(0,0,0,0.95), 0 0 0 1px rgba(13,192,223,0.28); }
  .card img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .scene.on .card img { animation: zoom 10s linear forwards; }
  @keyframes zoom { from { transform: scale(1); } to { transform: scale(1.03); } }
  .card .new { position: absolute; left: 18px; top: 18px; padding: 8px 16px; border-radius: 999px; background: var(--cyan); color: #04161b; font-size: 16px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; }

  .empty { position: absolute; left: 640px; top: 42px; width: 1220px; height: 860px; display: grid; place-items: center; text-align: center; border-radius: 24px; border: 2px dashed rgba(13,192,223,0.35); background: rgba(0,0,0,0.45); transition: opacity 1s var(--ease); }
  .empty.gone { opacity: 0; }
  .empty b { display: block; font: 800 64px/1.1 'Poppins', sans-serif; }
  .empty b em { font-style: normal; color: var(--cyan); }
  .empty span { display: block; margin-top: 20px; font-size: 28px; color: var(--dim); font-weight: 700; }
  @media (prefers-reduced-motion: reduce) { .scene.on .card img { animation: none; } }
</style>
</head>
<body>
<main class="screen">
  <aside class="panel">
    <img class="logo" src="assets/wharfedale-pro.svg" alt="Wharfedale Pro">
    <div class="wm">Soundcheck</div>
    <div class="yr">2026</div>
    <div class="live" id="live">Live album</div>
    <div class="add">
      <div class="qr"><img src="assets/qr-album.svg" alt="QR code to add your photo"></div>
      <div><b>Add your photo</b><span>Scan, snap, and you're on the big screen</span></div>
    </div>
  </aside>
  <div class="host">Hosted by <img src="assets/techniline.png" alt="Techniline"></div>

  <div class="empty" id="empty"><div><b>Tonight's photos <em>appear here</em></b><span>Scan the code, take a photo, and watch for it</span></div></div>
  <div class="stage">
    <div class="scene" id="s0"></div>
    <div class="scene" id="s1"></div>
  </div>
</main>
<script src="assets/screen.js"></script>
<script>
// Same Apps Script web app the landing page uploads to
var UPLOAD_URL = "https://script.google.com/macros/s/AKfycbxynfYEE2qiB1HFxrS-oyTYoNgV9NBKwyCXXEfTjQGxCkDrTJCgZFntyVSmqNgWF-Y/exec";
var SHOW_MS = 9000;      // how long each scene stays up
var REFRESH_MS = 15000;  // how often to check for newly approved photos
var STAGE_W = 1220, STAGE_H = 860, GAP = 40;

var photos = [], queue = [], seen = {}, firstLoad = true, cur = -1, layer = 0, timer = null;
// Cloudinary photos come resized for the screen; older ones load from Google Drive
function photoUrl(p, w) {
  if (p.c) return "https://res.cloudinary.com/xccqslt2/image/upload/f_auto,q_auto,c_limit,w_" + w + "/" + (p.v ? "v" + p.v + "/" : "") + p.id + ".jpg";
  return "https://drive.google.com/thumbnail?id=" + encodeURIComponent(p.id) + "&sz=w" + w;
}
function isWide(p) { return p.w && p.h && p.w > p.h * 1.05; }

function refresh() {
  return fetch(UPLOAD_URL + "?action=list&t=" + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res || !res.ok) return;
      var list = res.photos || [], ids = {};
      list.forEach(function (p) { ids[p.id] = true; });
      // newly approved photos jump the queue so they show up next (not on first load)
      var fresh = list.filter(function (p) { return !seen[p.id]; });
      fresh.forEach(function (p) { seen[p.id] = true; if (!firstLoad) p.isNew = true; });
      queue = (firstLoad ? [] : fresh).concat(queue).filter(function (p) { return ids[p.id]; });
      firstLoad = false;
      photos = list;
      document.getElementById("live").textContent = "Live album · " + list.length + (list.length === 1 ? " photo" : " photos");
      if (list.length && !timer) next();
      if (!list.length) { stop(); document.getElementById("empty").classList.remove("gone"); }
    })
    .catch(function () {});
}

function stop() {
  clearTimeout(timer); timer = null;
  document.querySelectorAll(".scene").forEach(function (s) { s.classList.remove("on"); });
}

function take() {
  if (queue.length) return queue.shift();
  if (!photos.length) return null;
  cur = (cur + 1) % photos.length;
  return photos[cur];
}

// A scene is one landscape photo across the stage, or two portrait photos side by side
function nextScene() {
  var a = take(); if (!a) return [];
  if (isWide(a) || photos.length < 2) return [a];
  for (var tries = 0; tries < photos.length; tries++) {
    var b = take();
    if (!b || b.id === a.id) break;
    if (!isWide(b)) return [a, b];
    queue.unshift(b); break; // keep the landscape one for its own scene
  }
  return [a];
}

function cardSize(p, count) {
  var ar = (p.w && p.h) ? p.w / p.h : 0.652;
  var maxW = count === 2 ? (STAGE_W - GAP) / 2 : STAGE_W;
  var h = STAGE_H, w = h * ar;
  if (w > maxW) { w = maxW; h = w / ar; }
  return { w: Math.round(w), h: Math.round(h) };
}

function next() {
  var shots = nextScene();
  if (!shots.length) { timer = null; return; }
  var urls = shots.map(function (p) { return photoUrl(p, isWide(p) ? 2400 : 1400); });
  var loaded = 0, failed = false;
  urls.forEach(function (u) {
    var im = new Image();
    im.onload = function () { if (++loaded === urls.length) show(shots, urls); };
    im.onerror = function () { if (!failed) { failed = true; timer = setTimeout(next, 500); } };
    im.src = u;
  });
  timer = timer || -1;
}

function show(shots, urls) {
  layer = 1 - layer;
  var s = document.getElementById("s" + layer), other = document.getElementById("s" + (1 - layer));
  s.innerHTML = "";
  shots.forEach(function (p, i) {
    var size = cardSize(p, shots.length), card = document.createElement("div");
    card.className = "card"; card.style.width = size.w + "px"; card.style.height = size.h + "px";
    var img = document.createElement("img"); img.src = urls[i]; img.alt = "";
    card.appendChild(img);
    if (p.isNew) { var tag = document.createElement("div"); tag.className = "new"; tag.textContent = "Just in"; card.appendChild(tag); p.isNew = false; }
    s.appendChild(card);
  });
  s.classList.remove("on"); void s.offsetWidth;
  s.classList.add("on"); other.classList.remove("on");
  document.getElementById("empty").classList.add("gone");
  timer = setTimeout(next, SHOW_MS);
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
