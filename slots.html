<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0b0b">
<title>Soundcheck · Slot list</title>
<link rel="icon" type="image/png" href="assets/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"] { --ink: #f5f5f5; --dim: #b5b5b5; --faint: #808080; --grey: #d9d9d9; --cyan: #0dc0df; --teal: #019298; --red: #ff8a95; --ease: cubic-bezier(.2,.7,.2,1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050505; color: var(--ink); font-family: 'Manrope', sans-serif; -webkit-font-smoothing: antialiased; }
  html.cursor-off, html.cursor-off * { cursor: none !important; }
  [hidden] { display: none !important; }

  /* PIN (outside the canvas, plain full window) */
  .lock { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 24px; background: #0b0b0b url("assets/grille.svg"); background-size: 34px 22px; }
  .lock form { width: 100%; max-width: 340px; text-align: center; }
  .lock .wm { font: 900 44px 'Poppins', sans-serif; color: var(--cyan); text-transform: uppercase; }
  .lock p { color: var(--dim); font-size: 14px; margin: 14px 0; }
  .lock input { width: 100%; text-align: center; font: 600 26px 'Manrope', sans-serif; letter-spacing: 0.4em; padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.18); background: rgba(0,0,0,0.5); color: var(--ink); }
  .lock input:focus { outline: none; border-color: var(--cyan); }
  .lock button { width: 100%; margin-top: 12px; min-height: 52px; border: 0; border-radius: 999px; background: var(--cyan); color: #04161b; font: 800 16px 'Manrope', sans-serif; cursor: pointer; }
  .lock .err { color: var(--red); font-size: 13px; min-height: 20px; margin: 10px 0 0; }

  /* fixed 1920 x 960 canvas (2:1 LED wall), scaled by assets/screen.js */
  .screen { position: fixed; left: 0; top: 0; width: 1920px; height: 960px; transform-origin: 0 0; overflow: hidden; background: radial-gradient(1400px 500px at 50% 0%, rgba(13,192,223,0.10), transparent 70%), #0b0b0b url("assets/grille.svg"); background-size: auto, 34px 22px; }
  .screen::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: linear-gradient(90deg, var(--cyan), var(--teal)); }

  .top { position: absolute; left: 60px; right: 60px; top: 34px; height: 110px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 30px; }
  .brand img { height: 92px; }
  .wordmark { font: 900 74px/0.9 'Poppins', sans-serif; color: var(--cyan); text-transform: uppercase; letter-spacing: -1px; }
  .wordmark small { display: block; font-size: 34px; font-weight: 800; color: var(--grey); margin-top: 6px; letter-spacing: 0; }
  .title { text-align: right; }
  .title b { display: block; font: 800 42px/1.05 'Poppins', sans-serif; text-transform: uppercase; }
  .title span { display: block; margin-top: 8px; font-size: 21px; font-weight: 800; letter-spacing: 6px; text-transform: uppercase; color: var(--cyan); }

  .cols { position: absolute; left: 50px; right: 50px; top: 172px; height: 752px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .col { position: relative; display: flex; flex-direction: column; border-radius: 22px; overflow: hidden; background: rgba(6,6,6,0.88); border: 1px solid rgba(255,255,255,0.10); }
  .col-head { flex: none; height: 76px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: var(--cyan); color: #04161b; }
  .col-head b { font: 900 42px/1 'Poppins', sans-serif; text-transform: uppercase; }
  .col-head span { font: 800 22px 'Manrope', sans-serif; white-space: nowrap; }
  .col-head i { font-style: normal; font-size: 17px; opacity: 0.75; margin-left: 8px; }
  .col-body { position: relative; flex: 1; }
  .page { position: absolute; inset: 0; padding: 12px 16px 18px; display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: column; grid-template-rows: repeat(18, 1fr); column-gap: 14px; opacity: 0; transition: opacity .9s var(--ease); }
  .page.on { opacity: 1; }
  .row { display: flex; align-items: center; gap: 8px; min-width: 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .row .num { flex: none; width: 26px; text-align: right; font: 800 14px 'Manrope', sans-serif; color: var(--faint); }
  .row .nm { min-width: 0; font: 800 19px/1.3 'Manrope', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.new .nm { color: var(--cyan); }
  .none { position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); font-size: 22px; font-weight: 700; }
</style>
</head>
<body>

<section class="lock" id="lock">
  <form id="pin-form" autocomplete="off">
    <div class="wm">Soundcheck</div>
    <p>Enter the team PIN to show the slot list.</p>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" aria-label="PIN" required>
    <button type="submit">Show slot list</button>
    <p class="err" id="pin-err" role="alert"></p>
  </form>
</section>

<main class="screen" id="board" hidden>
  <header class="top">
    <div class="brand">
      <img src="assets/wharfedale-pro.svg" alt="Wharfedale Pro">
      <div class="wordmark">Soundcheck<small>2026</small></div>
    </div>
    <div class="title"><b>Immersive Audio Experience</b><span>Find your name · your slot</span></div>
  </header>
  <section class="cols" id="cols"></section>
</main>

<script src="assets/screen.js"></script>
<script>
var API = "https://script.google.com/macros/s/AKfycbxynfYEE2qiB1HFxrS-oyTYoNgV9NBKwyCXXEfTjQGxCkDrTJCgZFntyVSmqNgWF-Y/exec";
var PER_PAGE = 36, PAGE_MS = 8000;   // two columns of 18 names per slot; longer lists page through
var pin = "", seen = null, cols = [];
var $ = function (id) { return document.getElementById(id); };
function store(k, v) { try { v === undefined ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} }
function recall(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }

function load() {
  return fetch(API + "?action=regs&pin=" + encodeURIComponent(pin) + "&t=" + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res.ok) throw new Error(res.error || "Couldn't load the list");
      render(res.slots || [], res.regs || []);
    });
}

function build(slots) {
  var box = $("cols"); box.innerHTML = "";
  cols = slots.map(function (s) {
    var col = document.createElement("article");
    col.className = "col";
    col.innerHTML = "<div class='col-head'><b></b><span></span></div><div class='col-body'></div>";
    col.querySelector("b").textContent = "Slot " + s.n;
    box.appendChild(col);
    return { n: s.n, el: col, body: col.querySelector(".col-body"), pages: [], page: 0, key: "" };
  });
}

function render(slots, regs) {
  if (cols.length !== slots.length) build(slots);
  var fresh = {};
  if (seen) regs.forEach(function (r) { if (!seen[r.n]) fresh[r.n] = 1; });
  seen = {}; regs.forEach(function (r) { seen[r.n] = 1; });
  slots.forEach(function (s, i) {
    var c = cols[i];
    var people = regs.filter(function (r) { return r.s === s.n; })
      .sort(function (a, b) { return a.name.localeCompare(b.name); });
    var open = s.left === null || s.left === undefined;
    var key = people.map(function (r) { return r.n + (fresh[r.n] ? "*" : ""); }).join(",");
    if (key === c.key) return paintHead(c, s, people.length, open); // nothing changed
    c.key = key;
    c.body.innerHTML = "";
    if (!people.length) { c.body.innerHTML = "<div class='none'>No bookings yet</div>"; c.pages = []; }
    var pages = [];
    for (var p = 0; p < people.length; p += PER_PAGE) {
      var page = document.createElement("div"); page.className = "page";
      people.slice(p, p + PER_PAGE).forEach(function (r, k) {
        var row = document.createElement("div"); row.className = "row" + (fresh[r.n] ? " new" : "");
        row.innerHTML = "<span class='num'></span><span class='nm'></span>";
        row.querySelector(".num").textContent = p + k + 1;
        row.querySelector(".nm").textContent = r.name;
        page.appendChild(row);
      });
      c.body.appendChild(page); pages.push(page);
    }
    c.pages = pages;
    if (c.page >= pages.length) c.page = 0;
    if (pages.length) pages[c.page].classList.add("on");
    paintHead(c, s, people.length, open);
  });
}

function paintHead(c, s, count, open) {
  var span = c.el.querySelector(".col-head span");
  span.textContent = open ? count + " booked" : count + " / " + s.cap;
  if (c.pages.length > 1) {
    var i = document.createElement("i"); i.textContent = (c.page + 1) + "/" + c.pages.length; span.appendChild(i);
  }
}

// Lists longer than one page fade to the next page every few seconds
function turnPages() {
  cols.forEach(function (c) {
    if (c.pages.length < 2) return;
    c.pages[c.page].classList.remove("on");
    c.page = (c.page + 1) % c.pages.length;
    c.pages[c.page].classList.add("on");
    var i = c.el.querySelector(".col-head i");
    if (i) i.textContent = (c.page + 1) + "/" + c.pages.length;
  });
}

function unlock(p) {
  pin = p;
  return load().then(function () {
    store("sc-pin", pin);
    $("lock").hidden = true; $("board").hidden = false;
    window.fitScreen();
    setInterval(function () { load().catch(function () {}); }, 15000);
    setInterval(turnPages, PAGE_MS);
  });
}
$("pin-form").addEventListener("submit", function (e) {
  e.preventDefault();
  $("pin-err").textContent = "Checking…";
  unlock($("pin").value.trim())
    .then(function () { $("pin-err").textContent = ""; })
    .catch(function (e2) { $("pin-err").textContent = e2.message || "Wrong PIN"; store("sc-pin"); });
});
var saved = recall("sc-pin");
if (saved) unlock(saved).catch(function () { store("sc-pin"); });
</script>
</body>
</html>
