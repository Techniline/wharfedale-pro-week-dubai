<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0b0b">
<title>Soundcheck · Team admin</title>
<link rel="icon" type="image/png" href="assets/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700;1,800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"] {
    --bg: #0b0b0b; --card: #161616; --ink: #f5f5f5; --dim: #b5b5b5; --faint: #808080;
    --hair: rgba(255,255,255,0.10); --hair-strong: rgba(255,255,255,0.18);
    --teal: #0dc0df; --teal-soft: #86e3f4; --teal-2: #0a9fc0; --tint: rgba(13,192,223,0.10); --tint-strong: rgba(13,192,223,0.25);
    --red: #ff8a95; --red-bg: #2a1517; --ease: cubic-bezier(.2,.7,.2,1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  h1, h2 { font-family: 'Poppins', 'Manrope', sans-serif; font-weight: 800; margin: 0; }
  button { font: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  [hidden] { display: none !important; }

  /* PIN screen */
  .lock { min-height: 100svh; display: grid; place-items: center; padding: 24px; background: radial-gradient(60% 50% at 50% 30%, rgba(13,192,223,0.12), transparent 70%); }
  .lock form { width: 100%; max-width: 340px; text-align: center; }
  .lock img { height: 72px; width: auto; margin-bottom: 22px; }
  .lock h1 { font-size: 34px; font-weight: 900; text-transform: uppercase; color: var(--teal); }
  .lock h1 i { display: block; font-size: 15px; margin-top: 6px; font-style: normal; font-weight: 700; text-transform: none; color: #d9d9d9; }
  .lock p { color: var(--dim); font-size: 14px; margin: 20px 0 14px; }
  .lock input { width: 100%; text-align: center; font: 600 26px 'Manrope', sans-serif; letter-spacing: 0.4em; padding: 14px; border-radius: 14px; border: 1px solid var(--hair-strong); background: rgba(0,0,0,0.35); color: var(--ink); }
  .lock input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px var(--tint); }
  .lock .err { color: var(--red); font-size: 13px; min-height: 20px; margin: 10px 0 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; border-radius: 999px; border: 1px solid transparent; font-weight: 700; font-size: 15px; cursor: pointer; }
  .btn-primary { background: linear-gradient(135deg, #3fd2ee, var(--teal) 40%, var(--teal-2)); color: #04161b; margin-top: 12px; }

  /* Header */
  .top { position: sticky; top: 0; z-index: 10; background: rgba(11,11,11,0.86); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--hair); padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); }
  .top-row { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .top h2 { font-size: 21px; }
  .top .live { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--teal); text-decoration: none; border: 1px solid var(--tint-strong); border-radius: 999px; padding: 7px 12px; white-space: nowrap; }
  .auto-row { max-width: 1100px; margin: 12px auto 0; }
  .switch { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--hair-strong); background: rgba(255,255,255,0.02); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: border-color .25s, background .25s; }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .track { position: relative; flex: none; width: 48px; height: 28px; border-radius: 999px; background: #2e2e2e; transition: background .25s var(--ease); }
  .knob { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #d9d9d9; box-shadow: 0 2px 6px rgba(0,0,0,0.4); transition: transform .25s var(--ease), background .25s; }
  .switch input:checked + .track { background: var(--teal); }
  .switch input:checked + .track .knob { transform: translateX(20px); background: #fff; }
  .switch input:focus-visible + .track { outline: 2px solid var(--teal); outline-offset: 2px; }
  .switch-text { display: flex; flex-direction: column; line-height: 1.25; }
  .switch-text b { font-size: 14px; }
  .switch-text small { font-size: 12px; color: var(--faint); }
  .switch.on { border-color: var(--tint-strong); background: var(--tint); }
  .switch.on small { color: var(--teal); }
  .switch.busy { opacity: 0.6; pointer-events: none; }
  .tabs { max-width: 1100px; margin: 12px auto 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .tabs button { flex: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--hair-strong); background: transparent; color: var(--dim); font-size: 13px; font-weight: 700; cursor: pointer; }
  .tabs button.on { border-color: var(--teal); color: var(--teal); background: var(--tint); }
  .tabs b { display: inline-block; min-width: 20px; margin-left: 4px; padding: 1px 6px; border-radius: 10px; background: var(--hair-strong); color: var(--ink); font-size: 11px; }
  .tabs button.on b { background: var(--teal); color: #04161b; }

  /* Grid */
  main { max-width: 1100px; margin: 0 auto; padding: 16px 12px calc(40px + env(safe-area-inset-bottom)); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 960px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .card { border-radius: 14px; overflow: hidden; background: var(--card); border: 1px solid var(--hair); display: flex; flex-direction: column; animation: rise .35s var(--ease); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .card.leaving { opacity: 0; transform: scale(0.96); transition: all .25s var(--ease); }
  .thumb { aspect-ratio: 1; background: #121212 center / cover no-repeat; cursor: zoom-in; border: 0; padding: 0; }
  .meta { font-size: 11px; color: var(--faint); padding: 8px 10px 0; }
  .acts { display: flex; gap: 6px; padding: 8px; }
  .acts button { flex: 1; min-height: 40px; padding: 0 6px; border-radius: 10px; border: 0; font-weight: 800; font-size: 13px; white-space: nowrap; cursor: pointer; }
  .acts .ok { flex: 1.4; }
  .card { position: relative; }
  .del { display: grid; place-items: center; border: 1px solid rgba(255,138,149,0.4); background: rgba(10,6,7,0.72); color: var(--red); cursor: pointer; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .card > .del { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; z-index: 2; }
  .view .acts .del { flex: 0 0 52px; min-height: 50px; border-radius: 10px; }
  .ok { background: var(--teal); color: #04161b; }
  .no { background: var(--red-bg); color: var(--red); }
  .acts .no:only-child, .acts .ok:only-child { flex: 1; }
  .empty { text-align: center; color: var(--dim); padding: 60px 20px; border: 1px dashed var(--hair-strong); border-radius: 16px; }

  /* Preview */
  .view { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: rgba(4,4,4,0.95); }
  .view img { max-width: 100%; max-height: calc(100svh - 120px); border-radius: 10px; }
  .view .acts { position: fixed; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }
  .view .acts button { min-height: 50px; font-size: 15px; }
  .view .close { position: fixed; top: max(14px, env(safe-area-inset-top)); right: 14px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--hair-strong); background: rgba(22,22,22,0.85); color: var(--ink); font-size: 20px; cursor: pointer; }

  /* View switch: Photos / Bookings */
  .views { display: inline-flex; padding: 3px; border-radius: 999px; border: 1px solid var(--hair-strong); background: rgba(255,255,255,0.02); }
  .views button { border: 0; background: transparent; color: var(--dim); font-weight: 800; font-size: 13px; padding: 7px 14px; border-radius: 999px; cursor: pointer; }
  .views button.on { background: var(--teal); color: #04161b; }

  /* Bookings */
  .slots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  @media (min-width: 760px) { .slots { grid-template-columns: repeat(5, 1fr); } }
  .slot { border: 1px solid var(--hair-strong); background: var(--card); border-radius: 14px; padding: 12px 14px; }
  .slot small { display: block; font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
  .slot b { display: block; font-family: 'Poppins', 'Manrope', sans-serif; font-weight: 800; font-size: 28px; margin: 4px 0 8px; }
  .slot b span { font-family: 'Manrope', sans-serif; font-size: 13px; color: var(--faint); font-weight: 700; }
  .bar { height: 6px; border-radius: 6px; background: #262626; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--teal); border-radius: 6px; transition: width .4s var(--ease); }
  .slot.full { border-color: var(--tint-strong); }
  .slot.full small { color: var(--teal); }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .tools input { flex: 1 1 220px; min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--hair-strong); background: rgba(0,0,0,0.35); color: var(--ink); font: 600 14px 'Manrope', sans-serif; }
  .tools input:focus { outline: none; border-color: var(--teal); }
  .chip { display: inline-flex; align-items: center; min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--tint-strong); background: transparent; color: var(--teal); font-weight: 800; font-size: 13px; text-decoration: none; cursor: pointer; white-space: nowrap; }
  .regs { display: grid; gap: 8px; }
  .reg { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 12px 12px 14px; border-radius: 14px; border: 1px solid var(--hair); background: var(--card); }
  .reg .no { font-family: 'Poppins', 'Manrope', sans-serif; font-weight: 800; font-size: 18px; color: var(--teal); background: none; white-space: nowrap; grid-row: span 2; }
  .reg .who b { display: block; font-size: 15px; overflow-wrap: anywhere; }
  .reg .who span { display: block; font-size: 13px; color: var(--dim); overflow-wrap: anywhere; }
  .reg .contact { grid-column: 2; font-size: 12px; color: var(--faint); overflow-wrap: anywhere; }
  .reg .contact a { color: inherit; }
  .reg .side { grid-column: 3; grid-row: 1 / span 2; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .reg .slot-tag { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; background: var(--tint); color: var(--teal); white-space: nowrap; }
  .reg .won { font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 999px; background: #3a2f0c; color: #ffd666; white-space: nowrap; }
  .reg .x { width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(255,138,149,0.35); background: transparent; color: var(--red); cursor: pointer; display: grid; place-items: center; }

  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 40; padding: 12px 18px; border-radius: 12px; background: rgba(22,22,22,0.95); border: 1px solid var(--tint-strong); font-size: 14px; white-space: nowrap; }
</style>
</head>
<body>

<section class="lock" id="lock">
  <form id="pin-form" autocomplete="off">
    <img src="assets/wharfedale-pro.svg" alt="Wharfedale Pro">
    <h1>Soundcheck<i>Wharfedale Pro Week · Dubai</i></h1>
    <p>Enter the team PIN to manage photos and bookings.</p>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" aria-label="PIN" required>
    <button class="btn btn-primary" type="submit">Unlock</button>
    <p class="err" id="pin-err" role="alert"></p>
  </form>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="top-row">
      <nav class="views" aria-label="Section">
        <button class="on" type="button" data-view="photos">Photos</button>
        <button type="button" data-view="regs">Bookings</button>
      </nav>
      <a class="live" id="top-link" href="live.html" target="_blank" rel="noopener">Open big screen ↗</a>
    </div>
    <div class="auto-row" id="reg-bar" hidden>
      <label class="switch">
        <input type="checkbox" id="reg-open" role="switch">
        <span class="track" aria-hidden="true"><span class="knob"></span></span>
        <span class="switch-text"><b>Slot booking</b><small id="reg-hint">Loading…</small></span>
      </label>
    </div>
    <div id="photo-bar">
    <div class="auto-row">
      <label class="switch">
        <input type="checkbox" id="auto" role="switch">
        <span class="track" aria-hidden="true"><span class="knob"></span></span>
        <span class="switch-text"><b>Auto-approve</b><small id="auto-hint">New photos wait for approval</small></span>
      </label>
    </div>
    <nav class="tabs" role="tablist">
      <button class="on" data-tab="p" type="button">Waiting <b id="c-p">0</b></button>
      <button data-tab="a" type="button">Approved <b id="c-a">0</b></button>
      <button data-tab="h" type="button">Hidden <b id="c-h">0</b></button>
    </nav>
    </div>
  </header>
  <main>
    <div id="photo-main">
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden></div>
    </div>
    <div id="reg-main" hidden>
      <div class="slots" id="slots"></div>
      <div class="tools">
        <input id="q" type="search" placeholder="Search name, company, email, phone or number" aria-label="Search bookings">
        <button class="chip" type="button" id="csv">Export CSV</button>
        <a class="chip" href="slots.html" target="_blank" rel="noopener">Slot list screen ↗</a>
        <a class="chip" href="qr.html" target="_blank" rel="noopener">QR poster ↗</a>
      </div>
      <div class="regs" id="regs"></div>
      <div class="empty" id="regs-empty" hidden>No bookings yet. They appear here as guests book.</div>
    </div>
  </main>
</div>

<div class="view" id="view" hidden>
  <button class="close" type="button" aria-label="Close" onclick="closeView()">✕</button>
  <img id="view-img" alt="">
  <div class="acts" id="view-acts"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
// Same Apps Script web app the landing page uploads to
var UPLOAD_URL = "https://script.google.com/macros/s/AKfycbxynfYEE2qiB1HFxrS-oyTYoNgV9NBKwyCXXEfTjQGxCkDrTJCgZFntyVSmqNgWF-Y/exec";
var pin = "", items = [], tab = "p", viewing = null;
var EMPTY = { p: "No new photos waiting. New uploads appear here automatically.", a: "Nothing approved yet.", h: "No hidden photos." };

function store(k, v) { try { v === undefined ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} }
function recall(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
// Cloudinary photos come resized for the screen; older ones load from Google Drive
function photoUrl(p, w) {
  if (p.c) return "https://res.cloudinary.com/xccqslt2/image/upload/f_auto,q_auto,c_limit,w_" + w + "/" + (p.v ? "v" + p.v + "/" : "") + p.id + ".jpg";
  return "https://drive.google.com/thumbnail?id=" + encodeURIComponent(p.id) + "&sz=w" + w;
}
function ago(t) {
  var m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? "just now" : m < 60 ? m + " min ago" : Math.round(m / 60) + " h ago";
}
function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(t._h); t._h = setTimeout(function () { t.hidden = true; }, 2200);
}

function load() {
  return fetch(UPLOAD_URL + "?action=admin&pin=" + encodeURIComponent(pin) + "&t=" + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res.ok) throw new Error(res.error || "Couldn't load photos");
      if (!Array.isArray(res.photos)) throw new Error("The photo service needs updating (new version not deployed yet).");
      items = res.photos;
      setAutoUI(!!res.auto);
      render();
      return true;
    });
}

function render() {
  ["p", "a", "h"].forEach(function (s) {
    document.getElementById("c-" + s).textContent = items.filter(function (it) { return it.s === s; }).length;
  });
  var list = items.filter(function (it) { return it.s === tab; });
  var grid = document.getElementById("grid");
  grid.innerHTML = "";
  list.forEach(function (it) {
    var card = document.createElement("div");
    card.className = "card"; card.dataset.id = it.id;
    var b = document.createElement("button");
    b.className = "thumb"; b.type = "button"; b.setAttribute("aria-label", "View photo");
    b.style.backgroundImage = "url('" + photoUrl(it, 500) + "')";
    b.onclick = function () { openView(it); };
    var meta = document.createElement("div");
    meta.className = "meta"; meta.textContent = ago(it.t);
    card.appendChild(b); card.appendChild(meta); card.appendChild(actions(it)); card.appendChild(delBtn(it));
    grid.appendChild(card);
  });
  var empty = document.getElementById("empty");
  empty.hidden = list.length > 0;
  empty.textContent = EMPTY[tab];
}

function actions(it) {
  var wrap = document.createElement("div");
  wrap.className = "acts";
  if (it.s !== "a") wrap.appendChild(btn("ok", it.s === "h" ? "Restore" : "✓ Approve", function () { review(it, "a"); }));
  if (it.s !== "h") wrap.appendChild(btn("no", it.s === "a" ? "Hide from album" : "✕ Hide", function () { review(it, "h"); }));
  return wrap;
}
function delBtn(it) {
  var d = btn("del", "", function () { removePhoto(it); });
  d.setAttribute("aria-label", "Delete photo");
  d.title = "Delete photo";
  d.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';
  return d;
}
function btn(cls, label, fn) {
  var b = document.createElement("button");
  b.type = "button"; b.className = cls; b.textContent = label; b.onclick = fn;
  return b;
}

function review(it, status) {
  var prev = it.s;
  it.s = status;
  var card = document.querySelector('.card[data-id="' + it.id + '"]');
  if (card) card.classList.add("leaving");
  closeView();
  setTimeout(render, 220);
  toast(status === "a" ? "Approved: it's on the screen and website" : "Hidden");
  fetch(UPLOAD_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "review", pin: pin, id: it.id, status: status })
  })
    .then(function (r) { return r.json(); })
    .then(function (res) { if (!res.ok) throw new Error(res.error); })
    .catch(function (e) { it.s = prev; render(); toast("Didn't save: " + (e.message || "try again")); });
}

// --- Auto-approve switch ---------------------------------------------------
var autoBox = document.getElementById("auto");
function setAutoUI(on) {
  autoBox.checked = on;
  autoBox.closest(".switch").classList.toggle("on", on);
  document.getElementById("auto-hint").textContent = on
    ? "ON: new photos go live instantly. Hide any you don't want."
    : "New photos wait for approval";
}
autoBox.addEventListener("change", function () {
  var on = autoBox.checked;
  if (on && !confirm("Turn on Auto-approve? New photos will appear on the big screen and website straight away, without checking. You can still hide any photo afterwards.")) {
    autoBox.checked = false; return;
  }
  var sw = autoBox.closest(".switch");
  sw.classList.add("busy");
  fetch(UPLOAD_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "settings", pin: pin, auto: on })
  })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res.ok) throw new Error(res.error);
      setAutoUI(res.auto);
      toast(res.auto ? "Auto-approve is ON" : "Auto-approve is OFF: photos wait for approval");
    })
    .catch(function (e) {
      setAutoUI(!on);
      var msg = e.message === "Bad request" ? "Update the Google Script to use this switch" : (e.message || "try again");
      toast("Didn't save: " + msg);
    })
    .then(function () { sw.classList.remove("busy"); });
});

// Delete: removes it from the album everywhere and moves the file to the Drive bin
function removePhoto(it) {
  if (!confirm("Delete this photo? It disappears from the album and big screen, and the file moves to the Google Drive bin (restorable for 30 days).")) return;
  var i = items.indexOf(it);
  if (i >= 0) items.splice(i, 1);
  var card = document.querySelector('.card[data-id="' + it.id + '"]');
  if (card) card.classList.add("leaving");
  closeView();
  setTimeout(render, 220);
  toast("Deleted");
  fetch(UPLOAD_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "delete", pin: pin, id: it.id })
  })
    .then(function (r) { return r.json(); })
    .then(function (res) { if (!res.ok) throw new Error(res.error); })
    .catch(function (e) {
      if (i >= 0) items.splice(i, 0, it);
      render();
      var msg = e.message === "Bad request" ? "Update the Google Script to use Delete" : (e.message || "try again");
      toast("Didn't delete: " + msg);
    });
}

function openView(it) {
  viewing = it;
  document.getElementById("view-img").src = photoUrl(it, 1600);
  var a = actions(it);
  a.appendChild(delBtn(it));
  a.id = "view-acts";
  document.getElementById("view-acts").replaceWith(a);
  document.getElementById("view").hidden = false;
}
function closeView() { document.getElementById("view").hidden = true; viewing = null; }
document.getElementById("view").addEventListener("click", function (e) { if (e.target === this) closeView(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeView(); });

document.querySelectorAll(".tabs button").forEach(function (b) {
  b.onclick = function () {
    tab = b.dataset.tab;
    document.querySelectorAll(".tabs button").forEach(function (x) { x.classList.toggle("on", x === b); });
    render();
  };
});

// --- Bookings ---------------------------------------------------------------
var view = "photos", regs = [], regSlots = [], winners = [];
var DOT = String.fromCharCode(183);
function raffleNo(n) { return "SC-" + ("00" + n).slice(-3); }

function loadRegs() {
  return fetch(UPLOAD_URL + "?action=regs&pin=" + encodeURIComponent(pin) + "&t=" + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res.ok) throw new Error(res.error === "Wrong PIN" ? res.error : "Update the Google Script to see bookings");
      regs = res.regs; regSlots = res.slots; winners = res.winners || [];
      setRegOpenUI(res.open);
      renderRegs();
    });
}

function renderRegs() {
  var sw = document.getElementById("slots");
  sw.innerHTML = "";
  var cards = regSlots.slice();
  cards.push({ n: 0, taken: regs.filter(function (r) { return !r.s; }).length, cap: 0, left: null });
  cards.forEach(function (s) {
    var cap = s.cap || 0, open = s.left === null || s.left === undefined, d = document.createElement("div");
    d.className = "slot" + (!open && s.left <= 0 ? " full" : "");
    d.innerHTML = "<small></small><b></b><div class='bar'><i></i></div>";
    d.querySelector("small").textContent = !s.n ? "Raffle only" : "Slot " + s.n + " " + DOT + (open ? " Open" : s.left <= 0 ? " Full" : " " + s.left + " left");
    d.querySelector("b").innerHTML = s.taken + (open ? " <span>booked</span>" : " <span>/ " + cap + "</span>");
    d.querySelector("i").style.width = open ? "100%" : Math.round(100 * s.taken / Math.max(1, cap)) + "%";
    if (open) d.querySelector("i").style.opacity = "0.25";
    sw.appendChild(d);
  });

  var q = document.getElementById("q").value.trim().toLowerCase();
  var list = regs.filter(function (r) {
    if (!q) return true;
    return [raffleNo(r.n), r.name, r.co, r.em, r.ph, r.s ? "slot " + r.s : "raffle only"].join(" ").toLowerCase().indexOf(q) >= 0;
  });
  var box = document.getElementById("regs");
  box.innerHTML = "";
  list.forEach(function (r) {
    var row = document.createElement("div");
    row.className = "reg";
    row.innerHTML = "<div class='no'></div><div class='who'><b></b><span></span></div><div class='side'><span class='slot-tag'></span></div><div class='contact'><a class='em'></a> " + DOT + " <a class='ph'></a></div>";
    row.querySelector(".no").textContent = raffleNo(r.n);
    row.querySelector(".who b").textContent = r.name;
    row.querySelector(".who span").textContent = r.co;
    row.querySelector(".slot-tag").textContent = r.s ? "Slot " + r.s : "Raffle only";
    var em = row.querySelector(".em"); em.textContent = r.em; em.href = "mailto:" + r.em;
    var ph = row.querySelector(".ph"); ph.textContent = r.ph; ph.href = "tel:" + r.ph;
    var side = row.querySelector(".side");
    if (winners.indexOf(r.n) >= 0) {
      var w = document.createElement("span"); w.className = "won"; w.textContent = "Raffle winner"; side.appendChild(w);
    }
    var x = btn("x", "", function () { cancelReg(r); });
    x.setAttribute("aria-label", "Cancel booking " + raffleNo(r.n)); x.title = "Cancel booking";
    x.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    side.appendChild(x);
    box.appendChild(row);
  });
  var empty = document.getElementById("regs-empty");
  empty.hidden = list.length > 0;
  empty.textContent = regs.length ? "No bookings match your search." : "No bookings yet. They appear here as guests book.";
}
document.getElementById("q").addEventListener("input", renderRegs);

function cancelReg(r) {
  if (!confirm("Cancel booking " + raffleNo(r.n) + " for " + r.name + "?" + (r.s ? " Their seat in Slot " + r.s + " opens up again." : "") + " The number " + raffleNo(r.n) + " won't be given to anyone else.")) return;
  regs.splice(regs.indexOf(r), 1);
  regSlots.forEach(function (s) { if (s.n === r.s) { s.taken--; if (s.left !== null) s.left++; } });
  renderRegs();
  toast("Booking cancelled");
  post({ action: "regDelete", pin: pin, n: r.n })
    .catch(function (e) { loadRegs().catch(function () {}); toast("Didn't cancel: " + (e.message || "try again")); });
}

function post(body) {
  return fetch(UPLOAD_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(function (res) { if (!res.ok) throw new Error(res.error); return res; });
}

var regOpenBox = document.getElementById("reg-open");
function setRegOpenUI(on) {
  regOpenBox.checked = on;
  regOpenBox.closest(".switch").classList.toggle("on", on);
  document.getElementById("reg-hint").textContent = on ? "OPEN: guests can book from the QR code" : "CLOSED: the booking page says booking is closed";
}
regOpenBox.addEventListener("change", function () {
  var on = regOpenBox.checked;
  if (!on && !confirm("Close slot booking? Guests will no longer be able to book.")) { regOpenBox.checked = true; return; }
  var sw = regOpenBox.closest(".switch");
  sw.classList.add("busy");
  post({ action: "regSettings", pin: pin, open: on })
    .then(function (res) { setRegOpenUI(res.open); toast(res.open ? "Slot booking is OPEN" : "Slot booking is CLOSED"); })
    .catch(function (e) { setRegOpenUI(!on); toast("Didn't save: " + (e.message || "try again")); })
    .then(function () { sw.classList.remove("busy"); });
});

// Spreadsheet-safe CSV (values starting with = + - @ are prefixed so Excel won't run them)
function csvCell(v) {
  v = String(v == null ? "" : v);
  if (/^[=+\-@]/.test(v)) v = "'" + v;
  return '"' + v.replace(/"/g, '""') + '"';
}
document.getElementById("csv").addEventListener("click", function () {
  var rows = [["Raffle no", "Slot", "Name", "Company", "Email", "Phone", "Booked at (Dubai)", "Raffle winner"]];
  regs.forEach(function (r) {
    rows.push([raffleNo(r.n), r.s ? "Slot " + r.s : "Raffle only", r.name, r.co, r.em, r.ph,
      new Date(r.t).toLocaleString("en-GB", { timeZone: "Asia/Dubai" }), winners.indexOf(r.n) >= 0 ? "Yes" : ""]);
  });
  var csv = rows.map(function (row) { return row.map(csvCell).join(","); }).join("\r\n");
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([String.fromCharCode(0xfeff) + csv], { type: "text/csv;charset=utf-8" }));
  a.download = "soundcheck-bookings.csv";
  document.body.appendChild(a); a.click(); a.remove();
});

function showView(v) {
  view = v;
  document.querySelectorAll(".views button").forEach(function (b) { b.classList.toggle("on", b.dataset.view === v); });
  document.getElementById("photo-bar").hidden = v !== "photos";
  document.getElementById("photo-main").hidden = v !== "photos";
  document.getElementById("reg-bar").hidden = v !== "regs";
  document.getElementById("reg-main").hidden = v !== "regs";
  var link = document.getElementById("top-link");
  link.href = v === "regs" ? "draw.html" : "live.html";
  link.textContent = v === "regs" ? "Raffle draw ↗" : "Open big screen ↗";
  store("sc-view", v);
  if (v === "regs") loadRegs().catch(function (e) { toast(e.message || "Couldn't load bookings"); });
}
document.querySelectorAll(".views button").forEach(function (b) { b.onclick = function () { showView(b.dataset.view); }; });

function unlock(p) {
  pin = p;
  return load().then(function () {
    store("sc-pin", pin);
    document.getElementById("lock").hidden = true;
    document.getElementById("app").hidden = false;
    if (recall("sc-view") === "regs") showView("regs");
    setInterval(function () {
      if (document.hidden) return;
      if (view === "regs") loadRegs().catch(function () {});
      else if (!viewing) load().catch(function () {});
    }, 15000);
  });
}

document.getElementById("pin-form").addEventListener("submit", function (e) {
  e.preventDefault();
  var err = document.getElementById("pin-err");
  err.textContent = "Checking…";
  unlock(document.getElementById("pin").value.trim())
    .then(function () { err.textContent = ""; })
    .catch(function (e2) { err.textContent = e2.message || "Wrong PIN"; store("sc-pin"); });
});

// Stay unlocked for this browser tab session
var saved = recall("sc-pin");
if (saved) unlock(saved).catch(function () { store("sc-pin"); });
</script>
</body>
